version: '3.8'

services:
  # ClickHouse for Analytics
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: bhai-dns-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: dns_analytics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: password
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse:/etc/clickhouse-server/config.d
    networks:
      - bhai-dns-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Kafka for Event Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: bhai-dns-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - bhai-dns-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: bhai-dns-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bhai-dns-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: bhai-dns-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bhai_dns
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - bhai-dns-network

  # Enhanced Rust Backend with Kafka and ClickHouse
  bhai-dns-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhai-dns-backend
    restart: unless-stopped
    environment:
      - DATABASE_URI=mongodb://admin:password@mongodb:27017/bhai_dns?authSource=admin
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=password
      - RUST_LOG=info
    ports:
      - "5353:5353/udp"  # DNS Server
      - "8080:8080"      # Web API
      - "9090:9090"      # Metrics
    depends_on:
      - mongodb
      - redis
      - kafka
      - clickhouse
    volumes:
      - ./config.toml:/app/config.toml:ro
    networks:
      - bhai-dns-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  bhai-dns-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhai-dns-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - bhai-dns-backend
    networks:
      - bhai-dns-network
    environment:
      - REACT_APP_API_URL=http://localhost:8080

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: bhai-dns-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - bhai-dns-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: bhai-dns-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - bhai-dns-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: bhai-dns-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - bhai-dns-network
    depends_on:
      - prometheus

networks:
  bhai-dns-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data: